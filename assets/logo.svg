<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%" role="img" aria-label="MCROS Logo">
  <defs>
    <linearGradient id="mcr-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="mcr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="1000" height="300" rx="32" fill="#0B132B" />
  
  <!-- Icon Squircle -->
  <g transform="translate(60, 50)">
    <rect width="200" height="200" rx="48" fill="url(#mcr-primary)" filter="url(#mcr-shadow)" />
    <!-- Monogram MCR -->
    <path d="M 50 150 L 50 60 L 90 115 L 100 130 L 110 115 L 150 60 L 150 150" 
          fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="300" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="84" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    MCROS<tspan fill="#60A5FA">.V3</tspan>
  </text>
  <text x="304" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="28" font-weight="600" fill="#94A3B8" letter-spacing="2">
    MAHESHWAR CHANDRA ROY OPERATING SYSTEM
  </text>
  <text x="304" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="20" font-weight="500" fill="#38BDF8">
    Autonomous AI Engineering, Research &amp; Production OS
  </text>
</svg>
